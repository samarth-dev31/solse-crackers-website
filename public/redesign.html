<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Solse | Cyberpunk Festive Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --neon-cyan: #00F0FF;
      --neon-gold: #FFD700;
      --dark-bg: #03040B;
    }
    body {
      background-color: var(--dark-bg);
      color: #E2E8F0;
      font-family: 'Space Grotesk', sans-serif;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    .font-display { font-family: 'Outfit', sans-serif; }

    /* FUTURISTIC BACKGROUND ENGINE */
    .cyber-scanlines {
      position: fixed; inset: 0; z-index: 50; pointer-events: none;
      background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
      background-size: 100% 4px; opacity: 0.15;
    }
    
    .holo-light-cyan {
      position: fixed; top: -20%; left: -10%; width: 70vw; height: 70vw;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.15) 0%, transparent 60%);
      filter: blur(50px); z-index: 0; pointer-events: none;
    }
    
    .holo-light-gold {
      position: fixed; bottom: -20%; right: -10%; width: 80vw; height: 80vw;
      background: radial-gradient(circle, rgba(255, 215, 0, 0.12) 0%, transparent 60%);
      filter: blur(60px); z-index: 0; pointer-events: none;
    }

    /* Moving 3D Floor Grid */
    .cyber-grid-container {
      position: fixed; bottom: 0; left: 0; width: 100%; height: 60vh;
      perspective: 1000px; z-index: 0; pointer-events: none;
      mask-image: linear-gradient(to top, black 10%, transparent 100%);
      -webkit-mask-image: linear-gradient(to top, black 10%, transparent 100%);
    }
    .cyber-grid {
      position: absolute; top: 0; left: -50%; width: 200%; height: 200%;
      background-image: 
        linear-gradient(to right, rgba(0, 240, 255, 0.15) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 240, 255, 0.15) 1px, transparent 1px);
      background-size: 40px 40px;
      transform: rotateX(75deg) translateY(0);
      animation: gridMove 3s linear infinite;
    }
    @keyframes gridMove {
      0% { transform: rotateX(75deg) translateY(0); }
      100% { transform: rotateX(75deg) translateY(40px); }
    }

    /* HUD Glassmorphism & Neon Borders */
    .hud-nav {
      background: rgba(3, 4, 11, 0.6); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0, 240, 255, 0.3);
      box-shadow: 0 4px 30px rgba(0, 240, 255, 0.1);
    }
    .hud-card {
      background: linear-gradient(145deg, rgba(10, 15, 30, 0.6) 0%, rgba(2, 4, 10, 0.9) 100%);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(0, 240, 255, 0.2);
      border-left: 2px solid var(--neon-cyan);
      box-shadow: 0 10px 30px -10px rgba(0, 240, 255, 0.15);
      transition: all 0.3s ease;
    }
    .hud-card:hover {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.2), inset 0 0 15px rgba(0, 240, 255, 0.05);
      transform: translateY(-3px);
    }

    /* Glowing Text & Cyber Buttons */
    .text-neon-cyan {
      color: var(--neon-cyan);
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    }
    .text-neon-gold {
      color: var(--neon-gold);
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
    }
    .btn-cyber {
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.2), inset 0 0 5px rgba(0, 240, 255, 0.2);
      text-transform: uppercase; letter-spacing: 2px;
    }
    .btn-cyber-gold {
      background: var(--neon-gold);
      color: #000;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
      text-transform: uppercase; letter-spacing: 1px; font-weight: 800;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="pb-32 selection:bg-cyan-400 selection:text-black">

  <!-- Futuristic Background Elements -->
  <div class="cyber-scanlines"></div>
  <div class="holo-light-cyan"></div>
  <div class="holo-light-gold"></div>
  <div class="cyber-grid-container"><div class="cyber-grid"></div></div>

  <!-- HUD Navbar -->
  <header class="sticky top-0 z-50 hud-nav">
    <div class="max-w-6xl mx-auto px-4 py-3.5 flex items-center justify-between">
      <a href="#" class="flex items-center gap-3 relative z-10">
        <div class="w-10 h-10 rounded-lg bg-cyan-950 border border-cyan-400 flex items-center justify-center shadow-[0_0_15px_rgba(0,240,255,0.4)]">
          <i data-lucide="cpu" class="w-5 h-5 text-neon-cyan"></i>
        </div>
        <div>
          <span class="font-display font-black text-xl tracking-wider text-white block leading-none">SOLSE <span class="text-neon-cyan">SYS</span></span>
          <span class="text-[9px] uppercase tracking-[0.3em] text-cyan-400 font-bold block mt-1">v2.0 // Active</span>
        </div>
      </a>
      <a href="https://wa.me/919595654444" target="_blank" class="btn-cyber text-[10px] font-bold px-4 py-2.5 rounded-lg flex items-center gap-2 active:scale-95 transition relative z-10">
        <i data-lucide="terminal" class="w-3.5 h-3.5"></i>
        <span>INIT_CHAT</span>
      </a>
    </div>
  </header>

  <!-- Main Content -->
  <main class="relative z-10 max-w-6xl mx-auto px-4">

    <!-- Hero Section -->
    <section class="pt-10 pb-12 text-center">
      <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-md bg-cyan-950/50 border border-cyan-500/50 text-cyan-400 text-[10px] font-bold tracking-[0.2em] uppercase mb-6 backdrop-blur-sm">
        <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-pulse"></span>
        System Online: Diwali Protocol
      </div>

      <h1 class="font-display font-black text-5xl sm:text-7xl leading-[1.1] tracking-tighter mb-4 text-white uppercase">
        Next-Gen<br />
        <span class="text-neon-gold">Pyrotechnics</span>
      </h1>

      <p class="text-slate-400 text-sm font-medium max-w-xl mx-auto mb-8 tracking-wide">
        Initialize your festive sequence. Direct factory-grade fireworks delivered via secure WhatsApp encryption routing.
      </p>

      <div class="flex flex-col sm:flex-row justify-center gap-4 max-w-md mx-auto">
        <a href="#catalog" class="btn-cyber-gold text-xs py-3.5 px-8 rounded-lg flex items-center justify-center gap-2 active:scale-95 transition">
          <i data-lucide="zap" class="w-4 h-4"></i>
          <span>Access Database</span>
        </a>
      </div>
    </section>

    <!-- Cyber Catalog Section -->
    <section id="catalog" class="pt-4 pb-12">
      <div class="flex flex-col sm:flex-row sm:items-end justify-between mb-6 gap-4">
        <div>
          <span class="text-[10px] font-bold uppercase tracking-[0.3em] text-cyan-400 block mb-1">Module: Inventory</span>
          <h2 class="font-display font-black text-2xl uppercase tracking-wider">Asset Catalog</h2>
        </div>
        <div class="relative w-full sm:w-72">
          <i data-lucide="search" class="w-4 h-4 text-cyan-500/50 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
          <input id="searchInput" type="text" placeholder="QUERY DATABASE..." oninput="renderCatalog()" class="w-full bg-slate-900/60 border border-cyan-500/30 focus:border-cyan-400 rounded-lg pl-10 pr-4 py-3 text-xs font-bold tracking-widest uppercase text-white placeholder-cyan-700 outline-none backdrop-blur-md transition" />
        </div>
      </div>

      <div id="categoryRow" class="flex gap-2 overflow-x-auto no-scrollbar pb-4 mb-4"></div>
      <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
    </section>
  </main>

  <!-- Holographic Checkout Bar -->
  <div id="stickyCart" class="fixed bottom-4 left-1/2 -translate-x-1/2 w-[calc(100%-1.5rem)] max-w-lg z-50 transition-all duration-300 translate-y-32 opacity-0 pointer-events-none">
    <div class="bg-slate-950/90 backdrop-blur-xl border-t-2 border-neon-cyan rounded-xl p-4 shadow-[0_0_30px_rgba(0,240,255,0.15)] flex items-center justify-between gap-3">
      <div>
        <div class="flex items-center gap-2 mb-1">
          <span id="cartBadge" class="bg-cyan-500/20 text-cyan-400 border border-cyan-500/50 font-bold text-[9px] tracking-widest px-2 py-0.5 rounded uppercase">1 UNIT</span>
          <span class="text-[10px] text-slate-400 uppercase tracking-widest">Sys. Total</span>
        </div>
        <div class="font-display font-black text-2xl text-neon-gold tracking-tight" id="cartTotal">₹0</div>
      </div>
      <button onclick="sendWhatsAppOrder()" class="btn-cyber-gold text-xs px-6 py-3 rounded-lg flex items-center gap-2 active:scale-95 transition shrink-0">
        <span>TRANSMIT</span>
        <i data-lucide="rocket" class="w-4 h-4"></i>
      </button>
    </div>
  </div>

  <script>
    const WHATSAPP_NUMBER = "919595654444";
    const products = [
      { id: 1, name: "Mega Celebration Pack", cat: "COMBO", badge: "bg-amber-500/20 text-amber-400 border-amber-500/50", price: 1499, mrp: 2999, code: "C-01", desc: "High-yield festive combo matrix. Includes aerials, ground units, and sparks.", img: "/mega-celebration-pack.png", fallback: "https://images.unsplash.com/photo-1514565131-fce0801e5785?auto=format&fit=crop&w=800&q=80" },
      { id: 2, name: "Multi Shot Cake", cat: "AERIAL", badge: "bg-rose-500/20 text-rose-400 border-rose-500/50", price: 650, mrp: 1200, code: "A-25", desc: "25-round automated aerial repeater. Neon bursts and crackle physics.", img: "/multi-shot-cake.png", fallback: "https://images.unsplash.com/photo-1498931299472-f7a63a5a1cfa?auto=format&fit=crop&w=800&q=80" },
      { id: 3, name: "Colour Sparklers", cat: "SAFE", badge: "bg-purple-500/20 text-purple-400 border-purple-500/50", price: 180, mrp: 350, code: "S-10", desc: "Low-emission neon spark emitters. Safe for proximity handling.", img: "/colour-sparklers.png", fallback: "https://images.unsplash.com/photo-1531747118685-ca8fa6e08806?auto=format&fit=crop&w=800&q=80" }
    ];

    const categories = ["ALL", "COMBO", "AERIAL", "SAFE"];
    let activeCategory = "ALL";
    const cart = { 1: 1 };

    function renderCategories() {
      document.getElementById("categoryRow").innerHTML = categories.map(cat => 
        `<button onclick="setCategory('${cat}')" class="shrink-0 px-5 py-2 rounded-md font-bold text-[10px] tracking-widest uppercase transition-all ${cat === activeCategory ? 'bg-cyan-400 text-black shadow-[0_0_10px_rgba(0,240,255,0.5)]' : 'bg-slate-900/50 text-cyan-600 border border-cyan-900 hover:border-cyan-500'}">${cat}</button>`
      ).join("");
    }

    function renderCatalog() {
      const q = document.getElementById("searchInput").value.toLowerCase();
      const grid = document.getElementById("productGrid");
      const filtered = products.filter(p => (activeCategory === "ALL" || p.cat === activeCategory) && p.name.toLowerCase().includes(q));

      grid.innerHTML = filtered.map(p => {
        const qty = cart[p.id] || 0;
        return `
          <div class="hud-card rounded-xl overflow-hidden flex flex-col group relative">
            <!-- Glitch overlay effect on hover -->
            <div class="absolute inset-0 bg-cyan-400/5 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none z-10"></div>
            
            <div class="relative h-48 bg-slate-950 flex items-center justify-center p-4 border-b border-cyan-500/20 overflow-hidden">
              <div class="absolute inset-0 bg-[linear-gradient(rgba(0,240,255,0.05)_1px,transparent_1px),linear-gradient(90deg,rgba(0,240,255,0.05)_1px,transparent_1px)] bg-[size:20px_20px]"></div>
              <img src="${p.img}" onerror="this.onerror=null; this.src='${p.fallback}';" class="w-full h-full object-contain relative z-10 group-hover:scale-110 transition duration-500" />
              <span class="absolute top-3 left-3 z-20 border ${p.badge} font-bold text-[9px] tracking-widest uppercase px-2 py-0.5 rounded backdrop-blur-md">${p.cat}</span>
              <span class="absolute bottom-3 right-3 z-20 font-mono text-[9px] text-cyan-700">ID:${p.code}</span>
            </div>
            
            <div class="p-5 flex-1 flex flex-col relative z-20">
              <h3 class="font-display font-black text-lg text-white uppercase tracking-wide">${p.name}</h3>
              <p class="text-[11px] text-slate-400 mt-1 mb-5 flex-1 leading-relaxed font-medium">${p.desc}</p>
              
              <div class="pt-4 border-t border-cyan-900/50 flex items-center justify-between">
                <div class="flex items-baseline gap-2">
                  <span class="font-display font-black text-2xl text-neon-gold">₹${p.price}</span>
                  <span class="text-[10px] text-slate-600 line-through">₹${p.mrp}</span>
                </div>
                ${qty === 0 
                  ? `<button onclick="updateQty(${p.id}, 1)" class="btn-cyber text-[10px] font-bold px-3 py-2 rounded">LOAD_DATA +</button>`
                  : `<div class="flex items-center gap-1 bg-slate-900 border border-cyan-500/50 rounded-md p-1">
                      <button onclick="updateQty(${p.id}, -1)" class="w-7 h-7 rounded bg-slate-800 hover:bg-slate-700 text-white font-bold flex items-center justify-center">−</button>
                      <span class="font-mono font-bold text-sm w-6 text-center text-neon-cyan">${qty}</span>
                      <button onclick="updateQty(${p.id}, 1)" class="w-7 h-7 rounded bg-cyan-500/20 hover:bg-cyan-500/40 text-cyan-400 font-bold flex items-center justify-center">+</button>
                    </div>`
                }
              </div>
            </div>
          </div>
        `;
      }).join("");

      setTimeout(() => { try { lucide.createIcons(); } catch(e) {} }, 50);
      updateStickyBar();
    }

    function setCategory(cat) { activeCategory = cat; renderCategories(); renderCatalog(); }
    function updateQty(id, delta) { cart[id] = Math.max(0, (cart[id] || 0) + delta); if (cart[id] === 0) delete cart[id]; renderCatalog(); }
    
    function updateStickyBar() {
      let count = 0, total = 0;
      for (const [id, qty] of Object.entries(cart)) {
        const item = products.find(p => p.id == id);
        if (item) { count += qty; total += item.price * qty; }
      }
      const bar = document.getElementById("stickyCart");
      if (count === 0) { bar.classList.add("translate-y-32", "opacity-0", "pointer-events-none"); } 
      else {
        bar.classList.remove("translate-y-32", "opacity-0", "pointer-events-none");
        document.getElementById("cartBadge").textContent = `${count} UNIT${count > 1 ? 'S' : ''}`;
        document.getElementById("cartTotal").textContent = `₹${total.toLocaleString('en-IN')}`;
      }
    }

    function sendWhatsAppOrder() {
      let lines = ["*--- NEBULA PROTOCOL INITIATED ---*"];
      lines.push("📡 *New Order Log: Solse Sys v2.0* 📡\n");
      let total = 0;
      for (const [id, qty] of Object.entries(cart)) {
        const item = products.find(p => p.id == id);
        if (item) {
          total += item.price * qty;
          lines.push(`> [${item.code}] ${item.name} | QTY: ${qty} | ₹${(item.price * qty).toLocaleString('en-IN')}`);
        }
      }
      lines.push(`\n⚡ *TOTAL DATA TRANSFER: ₹${total.toLocaleString('en-IN')}*`);
      window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(lines.join("\n"))}`, "_blank");
    }

    renderCategories();
    renderCatalog();
  </script>
</body>
</html>
